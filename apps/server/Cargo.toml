[package]
name = "strata-manager-server"
version.workspace = true
edition.workspace = true
description = "Headless Strata Manager with built-in Web panel (Ubuntu Server)"
publish = false

[[bin]]
name = "strata-manager-server"
path = "src/main.rs"

[lib]
name = "strata_manager_server"
path = "src/lib.rs"

[dependencies]
strata-runtime-core = { path = "../../crates/runtime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs", "net"] }
tokio-util = "0.7"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = "0.5"
http = "1"
futures-util = "0.3"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
