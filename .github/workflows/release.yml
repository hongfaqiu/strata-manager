name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable v<version> tag (defaults to the selected tag)
        type: string
        default: ''
      ci_run_id:
        description: Optional complete CI run for the exact tagged commit
        type: string
        default: ''
      macos_mode:
        description: 'macOS: empty = repository variable MACOS_RELEASE_MODE or auto; auto, include or defer'
        type: string
        default: ''

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-from-ci.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      expected_source_sha: ${{ github.event_name == 'push' && github.sha || '' }}
      ci_run_id: ${{ inputs.ci_run_id || '' }}
      macos_mode: ${{ inputs.macos_mode || '' }}
    secrets: inherit
