name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.mjs'
      - 'scripts/render-website-docs.mjs'
      - 'scripts/render-website-docs.test.mjs'
      - 'docs/**/*.md'
      - 'docs/screenshots/**'
      - 'README*'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'apps/desktop/public/licenses/**'
      - 'apps/desktop/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'assets/icon.svg'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked static rendering dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/configure-pages@v5
      - name: Check documentation rendering
        run: node --test scripts/render-website-docs.test.mjs
      - name: Package the static website
        run: node scripts/build-website.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
