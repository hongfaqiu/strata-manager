name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.mjs'
      - 'scripts/render-website-docs.mjs'
      - 'scripts/render-website-docs.test.mjs'
      - 'scripts/website-seo.mjs'
      - 'scripts/website-seo.test.mjs'
      - 'scripts/website-release-snapshot.mjs'
      - 'scripts/website-release-snapshot.test.mjs'
      - 'scripts/website-releases.test.mjs'
      - 'docs/**/*.md'
      - 'docs/screenshots/**'
      - 'README*'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'apps/desktop/public/licenses/**'
      - 'apps/desktop/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'assets/icon.svg'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  release:
    types: [published, edited]
  workflow_run:
    workflows: ['Release desktop']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && 'main' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked static rendering dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/configure-pages@v5
      - name: Check documentation, bilingual SEO and release metadata
        run: node --test scripts/render-website-docs.test.mjs scripts/website-seo.test.mjs scripts/website-releases.test.mjs scripts/website-release-snapshot.test.mjs
      - name: Package the static website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-website.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
