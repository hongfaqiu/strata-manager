name: Release verified CI installers

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-publish-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: hongfaqiu/strata-manager
      SOURCE_ROOT: ${{ github.workspace }}/release-source
      CARGO_TARGET_DIR: ${{ github.workspace }}/release-source/target
      UPDATE_VERIFIER_BIN: ${{ github.workspace }}/release-source/target/release/strata-update-verifier
    steps:
      - name: Require this repository and the main infrastructure branch
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != hongfaqiu/strata-manager || "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::This fixed release workflow must run from hongfaqiu/strata-manager main.'
            exit 2
          fi
          printf 'RELEASE_TEMP=%s/strata-release-from-ci-v013\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out the infrastructure for this workflow run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the exact application source independently
        uses: actions/checkout@v4
        with:
          ref: ec0797dc06fc833cb5ebf433ecfb71b4c113767c
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse moved source or version tag
        shell: bash
        run: |
          expected=ec0797dc06fc833cb5ebf433ecfb71b4c113767c
          [[ "$(git -C release-source rev-parse HEAD)" == "$expected" ]]
          [[ "$(git -C release-source rev-parse 'refs/tags/v0.1.3^{commit}')" == "$expected" ]]
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: release-source/pnpm-lock.yaml
      - name: Install only the fixed tag's locked dependencies
        working-directory: release-source
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build the exact tag's public signature verifier
        working-directory: release-source
        run: |
          cargo test -p strata-update-verifier --locked
          cargo build -p strata-update-verifier --release --locked
          node --test scripts/release-check.test.mjs scripts/release-tag.test.mjs scripts/release-assets.test.mjs scripts/release-publish.test.mjs
      - name: Check the fixed promotion plan and its refusal tests
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { PLAN } from './scripts/release-from-ci.mjs';
          assert.equal(PLAN.repository, 'hongfaqiu/strata-manager');
          assert.equal(PLAN.tag, 'v0.1.3');
          assert.equal(PLAN.version, '0.1.3');
          assert.equal(PLAN.sourceSha, 'ec0797dc06fc833cb5ebf433ecfb71b4c113767c');
          assert.equal(PLAN.runId, 38159155279);
          assert.equal(PLAN.formalRunId, 38161099807);
          assert.equal(PLAN.workflowPath, '.github/workflows/ci.yml');
          assert.deepEqual(PLAN.artifacts.map(({ name, id, sha256 }) => ({ name, id, sha256 })), [
            { name: 'ci-windows-x64-nsis', id: 11709972517, sha256: '3150b9795da86427a49e0407141bf0b28ef71d212dc6ea155460bcea561bbc2e' },
            { name: 'ci-linux-amd64-appimage', id: 11710157903, sha256: '85dd7aa50f8bd6a4029f6fb8f1186cd880f17213741c350d72129bfd11c300e7' },
            { name: 'ci-linux-amd64-deb', id: 11710068043, sha256: 'd9f90edcadf588bf57edad7f6fc6df19af56b66896f40185f5f94a5c57203d52' }
          ]);
          JS
          node --test scripts/release-from-ci.test.mjs
      - name: Validate full CI, original writers and exact artifact bytes
        run: node scripts/release-from-ci.mjs prepare
      - name: Sign the three original installers with the version bound
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-from-ci.mjs sign
      - name: Verify all eight assets and publish the exact source tag
        run: node scripts/release-from-ci.mjs publish
