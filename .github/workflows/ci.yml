name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Select Node before installing pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        # The observer verifies server.py by SHA256 on every platform.
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        # These exact pins come from the verified upstream requirements.txt.
        # MockEngine needs Jinja2/MarkupSafe; GPU, build and model packages are unused.
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the API metadata observer without model weights
        env:
          STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata
        run: |
          python -c "import hashlib, os, pathlib, sys; sys.path.insert(0, 'apps/supervisor/resources'); import strata_observer; source = pathlib.Path(os.environ['STRATA_TEST_ROOT']) / 'serve/server.py'; digest = hashlib.sha256(source.read_bytes()).hexdigest(); sys.exit(0 if digest in strata_observer.SUPPORTED_HASHES else 'The pinned upstream source hash is unsupported; refusing to skip API tests.')"
          python apps/supervisor/tests/test_strata_observer.py
          python apps/supervisor/tests/test_strata_mcp_guard.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Linux build and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring libglib2.0-bin libsecret-tools python3-venv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
      - run: pnpm install --frozen-lockfile
      - name: Read the checked application version
        id: package-version
        run: node scripts/release-check.mjs
      - name: Build the fixture update verifier for this platform
        run: cargo build -p strata-update-verifier --locked --target ${{ matrix.target }}
      - name: Version and release guard tests
        env:
          UPDATE_VERIFIER_BIN: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug/strata-update-verifier${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test scripts/release-check.test.mjs scripts/release-tag.test.mjs scripts/preview-package-smoke.test.mjs
      - name: Frontend types, core and HTTP fixture tests, build
        run: pnpm check
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target ${{ matrix.target }}
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Native tests (Windows)
        if: runner.os == 'Windows'
        # Process identity fixtures share host WMI/NetTCPConnection providers.
        # Serialize their cold starts; preserve every timeout and identity check.
        run: cargo test --workspace --locked --target ${{ matrix.target }} -- --test-threads=1
      - name: Native tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Rust checks
        run: cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Prepare packaged background binary
        run: node scripts/prepare-sidecar.mjs --profile release --target ${{ matrix.target }}
      - name: Build test installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'ci-[platform]-[arch]-[bundle]'
          uploadUpdaterJson: false

      - name: Verify installed Windows package and background IPC
        if: runner.os == 'Windows'
        run: node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"
      - name: Verify Linux AppImage and DEB startup under Xvfb
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"
