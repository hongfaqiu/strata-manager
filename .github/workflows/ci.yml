name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Select Node before installing pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        # These exact pins come from the verified upstream requirements.txt.
        # MockEngine needs Jinja2/MarkupSafe; GPU, build and model packages are unused.
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the API metadata observer without model weights
        env:
          STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata
        run: python apps/supervisor/tests/test_strata_observer.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Linux build and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring python3-venv
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
      - run: pnpm install --frozen-lockfile
      - name: Version and release guard tests
        run: node --test scripts/release-check.test.mjs
      - name: Frontend types, core and HTTP fixture tests, build
        run: pnpm check
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target ${{ matrix.target }}
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Native tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Native tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          # Only fixture credentials are stored in this disposable runner session.
          # Xvfb supplies a display; Secret Service also needs an unlocked DBus session.
          dbus-run-session -- xvfb-run -a bash -e -c '
            printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --workspace --locked --target ${{ matrix.target }}
          '
      - name: Rust checks
        run: cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Prepare packaged background binary
        run: node scripts/prepare-sidecar.mjs --profile release --target ${{ matrix.target }}
      - name: Build test installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'ci-[platform]-[arch]-[bundle]'
          uploadUpdaterJson: false
