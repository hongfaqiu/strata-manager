name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Keep PR merge validation and manually requested builds independent.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  observer-compatibility:
    name: Strata 0.1.43.1 observer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata-0.1.43.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the reviewed Strata 0.1.43.1 API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: a0116b2782a5b82622358c04a06496485d12b2d6
          path: .reference/strata-0.1.43.1
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the reviewed source and observer compatibility
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'apps/supervisor/resources')
          import strata_observer
          source = Path(os.environ['STRATA_TEST_ROOT']) / 'serve/server.py'
          digest = hashlib.sha256(source.read_bytes().replace(b'\r\n', b'\n')).hexdigest()
          expected = '6046f030abca250fd09f9a4fc95f5bb764d8420754acce049db2e4db77335bad'
          if digest != expected or digest not in strata_observer.SUPPORTED_HASHES:
              sys.exit('The reviewed Strata 0.1.43.1 source must exactly match its supported canonical hash.')
          PY
      - name: Verify all Strata 0.1.43.1 observer HTTP contracts without skips
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/supervisor/tests', pattern='test_strata_observer.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              sys.exit('Every reviewed Strata 0.1.43.1 observer contract must execute; skipped tests are not compatibility evidence.')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  native-windows:
    name: Windows native shard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          shared-key: strata-native-x86_64-pc-windows-msvc
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          # Only the desktop job saves the shared Windows dependency cache.
          save-if: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target x86_64-pc-windows-msvc
      - name: Run every assigned native test on the independent Windows runner
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-pc-windows-msvc --groups 3 --shard ${{ matrix.shard }}/3 --output "${{ runner.temp }}/native-shard-${{ matrix.shard }}.json"
      - name: Upload the complete native coverage proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-native-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  native-linux:
    name: Linux native shard (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Linux build and headless test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring libglib2.0-bin libsecret-tools python3-venv python3-dbus build-essential curl gettext libgcr-3-dev libgcrypt20-dev libtasn1-6-dev libp11-kit-dev libcap-ng-dev
      - name: Linux Secret Service wrapper contracts
        run: python scripts/tests/release-linux-tests-contract.py
      - name: Build the pinned private Linux test keyring
        run: |
          daemon_path=$(bash scripts/build-linux-test-keyring.sh)
          printf 'STRATA_TEST_KEYRING_DAEMON=%s\n' "$daemon_path" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          shared-key: strata-native-x86_64-unknown-linux-gnu
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          # The desktop Linux job is the sole writer for this target.
          save-if: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target x86_64-unknown-linux-gnu
      - name: Run every assigned native test with the private Linux keyring
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-unknown-linux-gnu --groups 3 --shard ${{ matrix.shard }}/3 --output "$RUNNER_TEMP/native-shard-${{ matrix.shard }}.json"
      - name: Upload the complete native coverage proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-native-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select Node before installing pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reusable release CI protocol
        run: node scripts/release-from-ci.mjs protocol
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        # The observer verifies server.py by SHA256 on every platform.
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        # These exact pins come from the verified upstream requirements.txt.
        # MockEngine needs Jinja2/MarkupSafe; GPU, build and model packages are unused.
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the API metadata observer without model weights
        env:
          STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata
        run: |
          python -c "import hashlib, os, pathlib, sys; sys.path.insert(0, 'apps/supervisor/resources'); import strata_observer; source = pathlib.Path(os.environ['STRATA_TEST_ROOT']) / 'serve/server.py'; digest = hashlib.sha256(source.read_bytes()).hexdigest(); sys.exit(0 if digest in strata_observer.SUPPORTED_HASHES else 'The pinned upstream source hash is unsupported; refusing to skip API tests.')"
          python apps/supervisor/tests/test_strata_observer.py
          python apps/supervisor/tests/test_strata_mcp_guard.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Linux build and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring libglib2.0-bin libsecret-tools python3-venv python3-dbus build-essential curl gettext libgcr-3-dev libgcrypt20-dev libtasn1-6-dev libp11-kit-dev libcap-ng-dev
      - name: Linux Secret Service wrapper contracts
        if: runner.os == 'Linux'
        run: python scripts/tests/release-linux-tests-contract.py
      - name: Build the pinned private Linux test keyring
        if: runner.os == 'Linux'
        run: |
          daemon_path=$(bash scripts/build-linux-test-keyring.sh)
          printf 'STRATA_TEST_KEYRING_DAEMON=%s\n' "$daemon_path" >> "$GITHUB_ENV"
      - name: Linux Secret Service fresh-connection regression
        if: runner.os == 'Linux'
        run: timeout --kill-after=5s 120s dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh /usr/bin/python3 scripts/tests/linux-secret-service-stress.py --deadline-seconds 100
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          shared-key: strata-native-${{ matrix.target }}
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: ${{ github.repository == 'hongfaqiu/strata-manager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: pnpm install --frozen-lockfile
      - name: Read the checked application version
        id: package-version
        run: node scripts/release-check.mjs
      - name: Build the fixture update verifier for this platform
        run: cargo build -p strata-update-verifier --locked --target ${{ matrix.target }}
      - name: Version and release guard tests
        env:
          UPDATE_VERIFIER_BIN: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug/strata-update-verifier${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test scripts/release-check.test.mjs scripts/release-tag.test.mjs scripts/release-assets.test.mjs scripts/release-publish.test.mjs scripts/preview-package-smoke.test.mjs scripts/download-upgrade-fixture.test.mjs scripts/release-from-ci.test.mjs scripts/ci-linux-native-tests.test.mjs scripts/ci-cache-policy.test.mjs
      - name: Verify the signed beta.2 installer for the first stable upgrade
        if: runner.os == 'Windows' && steps.package-version.outputs.version == '0.1.2'
        id: upgrade-fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_VERIFIER_BIN: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug/strata-update-verifier.exe
        run: node scripts/download-upgrade-fixture.mjs
      - name: Frontend types, core and HTTP fixture tests, build
        run: pnpm check
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target ${{ matrix.target }}
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust checks
        run: cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Prepare packaged background binary
        run: node scripts/prepare-sidecar.mjs --profile release --target ${{ matrix.target }}
      - name: Build test installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'ci-[platform]-[arch]-[bundle]'
          uploadUpdaterJson: false

      # Both platforms compile in parallel with native runners; complete coverage still
      # gates package smoke acceptance and reuse of the whole successful CI.
      - name: Wait for the three independent Windows native runners
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [0, 1, 2].map(i => `Windows native shard (${i}/3)`);
            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100,
              });
              const shards = expected.map(name => {
                const matches = jobs.filter(job => job.name === name);
                if (matches.length > 1) throw new Error(`Duplicate native job: ${name}`);
                return matches[0];
              });
              for (const job of shards.filter(Boolean)) {
                if (job.status === 'completed' && job.conclusion !== 'success') {
                  throw new Error(`${job.name}: ${job.conclusion}; complete native coverage is required.`);
                }
              }
              if (shards.every(job => job?.status === 'completed' && job.conclusion === 'success')) return;
              core.info(shards.map((job, i) => `${expected[i]}: ${job?.status ?? 'queued'}`).join('; '));
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for complete Windows native coverage.');
      - name: Download this attempt's Windows native coverage proofs
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-windows-native-shard-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-native-coverage
      - name: Native tests (Windows)
        if: runner.os == 'Windows'
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-pc-windows-msvc --groups 3 --aggregate "${{ runner.temp }}/windows-native-coverage" --output "${{ runner.temp }}/windows-native-coverage.json"

      - name: Wait for the three independent Linux native runners
        if: runner.os == 'Linux'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = [0, 1, 2].map(i => `Linux native shard (${i}/3)`);
            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo, run_id: context.runId, attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT), per_page: 100,
              });
              const shards = expected.map(name => {
                const matches = jobs.filter(job => job.name === name);
                if (matches.length > 1) throw new Error(`Duplicate native job: ${name}`);
                return matches[0];
              });
              for (const job of shards.filter(Boolean)) {
                if (job.status === 'completed' && job.conclusion !== 'success') {
                  throw new Error(`${job.name}: ${job.conclusion}; complete native coverage is required.`);
                }
              }
              if (shards.every(job => job?.status === 'completed' && job.conclusion === 'success')) return;
              core.info(shards.map((job, i) => `${expected[i]}: ${job?.status ?? 'queued'}`).join('; '));
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Timed out waiting for complete Linux native coverage.');
      - name: Download this attempt's Linux native coverage proofs
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-linux-native-shard-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-native-coverage
      - name: Native tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: node scripts/ci-linux-native-tests.mjs --aggregate "$RUNNER_TEMP/linux-native-coverage" --output "$RUNNER_TEMP/linux-native-coverage.json"

      - name: Verify installed Windows package and background IPC
        if: runner.os == 'Windows'
        run: node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"
      - name: Verify beta.2 to first stable upgrade and retained application data
        if: runner.os == 'Windows' && steps.package-version.outputs.version == '0.1.2'
        env:
          UPGRADE_FROM_INSTALLER: ${{ steps.upgrade-fixture.outputs.installer }}
          UPGRADE_FROM_VERSION: ${{ steps.upgrade-fixture.outputs.version }}
        run: node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}" --upgrade-from-installer "$env:UPGRADE_FROM_INSTALLER" --upgrade-from-version "$env:UPGRADE_FROM_VERSION"
      - name: Verify Linux AppImage and DEB startup under Xvfb
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"
