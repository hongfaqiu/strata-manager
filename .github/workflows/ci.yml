name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_notarization:
        description: 'macOS notarization: empty = repository variable MACOS_NOTARIZATION or auto; auto, wait or defer'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  # Keep PR merge validation and manually requested builds independent.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect app code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.set.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Push events need history so dorny/paths-filter can diff against the previous SHA.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'apps/**'
              - 'crates/**'
              - 'packages/**'
              - 'packaging/**'
              - 'scripts/**'
              - '!scripts/build-website.mjs'
              - '!scripts/website-*.mjs'
              - '!scripts/render-website-docs.mjs'
              - '!scripts/render-website-docs.test.mjs'
              - 'assets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-from-ci.yml'
              - '.github/workflows/macos-notarize-followup.yml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  observer-compatibility:
    name: Strata 0.1.43.1 observer (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata-0.1.43.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the reviewed Strata 0.1.43.1 API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: a0116b2782a5b82622358c04a06496485d12b2d6
          path: .reference/strata-0.1.43.1
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the reviewed source and observer compatibility
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'apps/supervisor/resources')
          import strata_observer
          source = Path(os.environ['STRATA_TEST_ROOT']) / 'serve/server.py'
          digest = hashlib.sha256(source.read_bytes().replace(b'\r\n', b'\n')).hexdigest()
          expected = '6046f030abca250fd09f9a4fc95f5bb764d8420754acce049db2e4db77335bad'
          if digest != expected or digest not in strata_observer.SUPPORTED_HASHES:
              sys.exit('The reviewed Strata 0.1.43.1 source must exactly match its supported canonical hash.')
          PY
      - name: Verify all Strata 0.1.43.1 observer HTTP contracts without skips
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/supervisor/tests', pattern='test_strata_observer.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              sys.exit('Every reviewed Strata 0.1.43.1 observer contract must execute; skipped tests are not compatibility evidence.')
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  native-windows:
    name: Windows native shard (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.10'
      - name: Pin the fixture interpreter instead of probing the py launcher
        shell: bash
        run: printf 'STRATA_MANAGER_TEST_PYTHON=%s\n' '${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          # Test-profile builds differ from desktop dev/release builds, so shards use
          # their own key; only trusted main pushes save it (concurrent saves are no-ops).
          shared-key: strata-native-test-x86_64-pc-windows-msvc
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: ${{ github.repository == 'hongfaqiu/strata-manager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target x86_64-pc-windows-msvc
      - name: Run every assigned native test on the independent Windows runner
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-pc-windows-msvc --groups 3 --shard ${{ matrix.shard }}/3 --output "${{ runner.temp }}/native-shard-${{ matrix.shard }}.json"
      - name: Upload the complete native coverage proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-native-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  native-linux:
    name: Linux native shard (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Linux build and headless test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring libglib2.0-bin libsecret-tools python3-venv python3-dbus build-essential curl gettext libgcr-3-dev libgcrypt20-dev libtasn1-6-dev libp11-kit-dev libcap-ng-dev
      - name: Linux Secret Service wrapper contracts
        run: python scripts/tests/release-linux-tests-contract.py
      - name: Build the pinned private Linux test keyring
        run: |
          daemon_path=$(bash scripts/build-linux-test-keyring.sh)
          printf 'STRATA_TEST_KEYRING_DAEMON=%s\n' "$daemon_path" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          # Test-profile builds differ from desktop dev/release builds, so shards use
          # their own key; only trusted main pushes save it (concurrent saves are no-ops).
          shared-key: strata-native-test-x86_64-unknown-linux-gnu
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: ${{ github.repository == 'hongfaqiu/strata-manager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: pnpm install --frozen-lockfile
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target x86_64-unknown-linux-gnu
      - name: Run every assigned native test with the private Linux keyring
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-unknown-linux-gnu --groups 3 --shard ${{ matrix.shard }}/3 --output "$RUNNER_TEMP/native-shard-${{ matrix.shard }}.json"
      - name: Upload the complete native coverage proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-native-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          # Apple Silicon only. macos-14 retires around 2026-11-02.
          # Intel (x86_64-apple-darwin) is skipped: upstream Strata Metal targets
          # Apple Silicon, and a second arch is a full extra compile.
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      # Ordinary pull requests skip the release-mode installer build and its
      # smoke tests. main, tags, manual runs, release/* PRs and PRs labelled
      # full-ci still build exactly what a release would promote.
      PACKAGE_INSTALLERS: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      # auto (default), wait or defer; see the macOS signing steps and docs/RELEASING.md.
      MACOS_NOTARIZATION: ${{ inputs.macos_notarization || vars.MACOS_NOTARIZATION || 'auto' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Select Node before installing pnpm 11
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reusable release CI protocol
        run: node scripts/release-from-ci.mjs protocol
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preserve the verified upstream source bytes
        # The observer verifies server.py by SHA256 on every platform.
        run: git config --global core.autocrlf false
      - name: Check out the verified upstream API fixture
        uses: actions/checkout@v4
        with:
          repository: Niko1221/Strata
          ref: fb58e0dbc8399662c0e47c76578c6e878b14f6cf
          path: .reference/strata
          persist-credentials: false
      - name: Install MockEngine test dependencies only
        # These exact pins come from the verified upstream requirements.txt.
        # MockEngine needs Jinja2/MarkupSafe; GPU, build and model packages are unused.
        run: python -m pip install jinja2==3.1.6 markupsafe==3.0.3
      - name: Verify the API metadata observer without model weights
        env:
          STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata
        run: python -c "import hashlib, os, pathlib, sys; sys.path.insert(0, 'apps/supervisor/resources'); import strata_observer; source = pathlib.Path(os.environ['STRATA_TEST_ROOT']) / 'serve/server.py'; digest = hashlib.sha256(source.read_bytes()).hexdigest(); sys.exit(0 if digest in strata_observer.SUPPORTED_HASHES else 'The pinned upstream source hash is unsupported; refusing to skip API tests.')"
      # Full observer/MCP suites need Linux/Windows fixtures and can hang on
      # macOS runners (real -m bootstrap network). Dedicated observer jobs
      # already cover them on windows-latest and ubuntu-22.04. Keep this as a
      # separate step (not a bash if) so Windows PowerShell never parses it.
      - name: Run full observer and MCP suites
        if: runner.os != 'macOS'
        env:
          STRATA_TEST_ROOT: ${{ github.workspace }}/.reference/strata
        run: |
          python apps/supervisor/tests/test_strata_observer.py
          python apps/supervisor/tests/test_strata_mcp_guard.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Linux build and headless test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libgtk-3-dev libssl-dev librsvg2-dev libxdo-dev libdbus-1-dev pkg-config patchelf xdg-utils xvfb dbus-x11 gnome-keyring libglib2.0-bin libsecret-tools python3-venv python3-dbus build-essential curl gettext libgcr-3-dev libgcrypt20-dev libtasn1-6-dev libp11-kit-dev libcap-ng-dev
      - name: Linux Secret Service wrapper contracts
        if: runner.os == 'Linux'
        run: python scripts/tests/release-linux-tests-contract.py
      - name: Build the pinned private Linux test keyring
        if: runner.os == 'Linux'
        run: |
          daemon_path=$(bash scripts/build-linux-test-keyring.sh)
          printf 'STRATA_TEST_KEYRING_DAEMON=%s\n' "$daemon_path" >> "$GITHUB_ENV"
      - name: Linux Secret Service fresh-connection regression
        if: runner.os == 'Linux'
        run: timeout --kill-after=5s 120s dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh /usr/bin/python3 scripts/tests/linux-secret-service-stress.py --deadline-seconds 100
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> apps/desktop/src-tauri/target'
          shared-key: strata-native-${{ matrix.target }}
          cache-bin: false
          cache-workspace-crates: false
          cache-all-crates: false
          save-if: ${{ github.repository == 'hongfaqiu/strata-manager' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: pnpm install --frozen-lockfile
      - name: Read the checked application version
        id: package-version
        run: node scripts/release-check.mjs
      - name: Build the fixture update verifier for this platform
        run: cargo build -p strata-update-verifier --locked --target ${{ matrix.target }}
      - name: Version and release guard tests
        env:
          UPDATE_VERIFIER_BIN: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug/strata-update-verifier${{ runner.os == 'Windows' && '.exe' || '' }}
        # ci-linux-native-tests.test.mjs runs a host libtest binary and rejects
        # hosts that are not its Windows/Linux target. Skip it on darwin so the
        # Apple Silicon job can reach packaging; Windows and Linux still run it.
        run: node --test scripts/release-check.test.mjs scripts/release-tag.test.mjs scripts/release-assets.test.mjs scripts/release-publish.test.mjs scripts/preview-package-smoke.test.mjs scripts/download-upgrade-fixture.test.mjs scripts/release-from-ci.test.mjs scripts/macos-notarize-followup.test.mjs ${{ runner.os != 'macOS' && 'scripts/ci-linux-native-tests.test.mjs' || '' }} scripts/ci-cache-policy.test.mjs
      - name: Verify the signed beta.2 installer for the first stable upgrade
        if: runner.os == 'Windows' && steps.package-version.outputs.version == '0.1.2'
        id: upgrade-fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_VERIFIER_BIN: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/debug/strata-update-verifier.exe
        run: node scripts/download-upgrade-fixture.mjs
      - name: Frontend types, core and HTTP fixture tests, build
        run: pnpm check
      - name: Prepare independent background binary
        run: node scripts/prepare-sidecar.mjs --profile debug --target ${{ matrix.target }}
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust checks
        run: cargo clippy --workspace --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Headless server crate tests
        if: runner.os == 'Linux'
        run: cargo test -p strata-manager-server --locked --all-targets
      - name: Package headless server
        if: runner.os == 'Linux' && env.PACKAGE_INSTALLERS == 'true'
        env:
          STRATA_MANAGER_SKIP_FRONTEND_BUILD: '1'
          STRATA_MANAGER_WEB_ROOT: ${{ github.workspace }}/apps/desktop/dist
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-packages"
          bash scripts/package-server.sh "$RUNNER_TEMP/server-packages"
          version="${{ steps.package-version.outputs.version }}"
          test -f "$RUNNER_TEMP/server-packages/Strata.Manager.Server_${version}_amd64.tar.gz"
          test -f "$RUNNER_TEMP/server-packages/Strata.Manager.Server_${version}_amd64.deb"
      - name: Upload headless server packages
        if: runner.os == 'Linux' && env.PACKAGE_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-amd64-server
          path: |
            ${{ runner.temp }}/server-packages/Strata.Manager.Server_${{ steps.package-version.outputs.version }}_amd64.tar.gz
            ${{ runner.temp }}/server-packages/Strata.Manager.Server_${{ steps.package-version.outputs.version }}_amd64.deb
          if-no-files-found: error
          compression-level: 0
      - name: Prepare packaged background binary
        if: env.PACKAGE_INSTALLERS == 'true'
        run: node scripts/prepare-sidecar.mjs --profile release --target ${{ matrix.target }}
      # macOS Developer ID signing + notarization. Every Apple secret is optional
      # so fork PRs and forks still build: without APPLE_CERTIFICATE the build
      # keeps the previous ad-hoc signature (APPLE_SIGNING_IDENTITY=-). Release-
      # capable runs in this repository (main, tags, manual runs) refuse to fall
      # back, because release-from-ci.yml promotes exactly these bytes.
      # Only non-empty values go to $GITHUB_ENV: tauri treats an empty
      # APPLE_SIGNING_IDENTITY as "provided" and fails. Notarization credentials
      # use STRATA_NOTARY_* names so tauri only signs; the app is submitted once
      # below and the DMG is only Developer ID signed (not notarized).
      # MACOS_NOTARIZATION: auto (default) waits up to MACOS_NOTARIZATION_TIMEOUT
      # and staples, or leaves macOS for the follow-up when Apple is slow; wait
      # always waits (fails if not accepted); defer only submits. Runs whose macOS
      # is not stapled can only feed a release that defers macOS, and
      # macos-notarize-followup.yml staples and adds macOS later.
      # Apple notarization only runs for builds that can become a release:
      # pull requests (including release/* and full-ci) never submit; a push to
      # main submits only when v<version> is not tagged yet (a release candidate)
      # or the tag already points at this commit (re-run of the release commit).
      # Manual runs (including the release resolver's tag dispatch) keep
      # MACOS_NOTARIZATION. Skipped runs are still signed, but the release
      # resolver never reuses them for macOS; it dispatches a fresh tag CI.
      - name: Decide whether this run notarizes macOS
        id: notary-policy
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          set -euo pipefail
          mode="$MACOS_NOTARIZATION"
          reason="$EVENT_NAME uses MACOS_NOTARIZATION=$mode"
          if [ "$EVENT_NAME" = pull_request ]; then
            mode=skipped; reason='pull requests never submit to Apple'
          elif [ "$EVENT_NAME" = push ]; then
            tag="v$VERSION"
            if refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              tag_sha=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag^{}" '$2 == r { print $1 }')
              [ -n "$tag_sha" ] || tag_sha=$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag" '$2 == r { print $1 }')
              if [ -z "$tag_sha" ]; then
                reason="$tag is not tagged yet (release candidate)"
              elif [ "$tag_sha" = "$GITHUB_SHA" ]; then
                reason="$tag already points at this commit (release commit re-run)"
              else
                mode=skipped; reason="$tag is already released from another commit (version not bumped)"
              fi
            else
              echo '::warning title=macOS notarization::Could not list tags; notarizing to be safe.'
            fi
          fi
          echo "macOS notarization: $mode ($reason)"
          [ "$mode" != skipped ] || echo "::notice title=macOS notarization skipped::$reason. Signed only; this run cannot publish macOS."
          printf '### macOS notarization: `%s`\n\n%s\n' "$mode" "$reason" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        env:
          NOTARY_MODE: ${{ steps.notary-policy.outputs.mode }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REQUIRE_APPLE_SIGNING: ${{ github.repository == 'hongfaqiu/strata-manager' && github.event_name != 'pull_request' && '1' || '' }}
        run: |
          set -euo pipefail
          case "$MACOS_NOTARIZATION" in auto|wait|defer) ;; *) echo '::error::MACOS_NOTARIZATION must be auto, wait or defer.'; exit 1;; esac
          echo "macOS notarization mode: $MACOS_NOTARIZATION"
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            if [ -n "$REQUIRE_APPLE_SIGNING" ]; then
              echo '::error title=macOS signing::APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD are required for release-capable builds in this repository.'
              exit 1
            fi
            echo '::warning title=macOS unsigned::No Apple certificate (fork or PR without secrets); using ad-hoc signing, not notarized.'
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          # Temporary keychain, deleted by the clean-up step at the end of the job.
          keychain="$RUNNER_TEMP/strata-signing.keychain-db"
          kc_pass=$(openssl rand -base64 32)
          echo "::add-mask::$kc_pass"
          cert="$RUNNER_TEMP/strata-signing.p12"
          ( umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert" )
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"' || true)
          if [ -z "$identity" ]; then
            echo "::error title=macOS signing::APPLE_CERTIFICATE has no 'Developer ID Application' identity (export the certificate together with its private key as .p12)."
            exit 1
          fi
          if [ -n "${APPLE_TEAM_ID:-}" ] && [[ "$identity" != *"($APPLE_TEAM_ID)" ]]; then
            echo "::error title=macOS signing::Signing identity does not belong to APPLE_TEAM_ID."
            exit 1
          fi
          echo "Signing identity: $identity"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "STRATA_SIGNING_KEYCHAIN=$keychain"
            echo "STRATA_MACOS_SIGNED=1"
          } >> "$GITHUB_ENV"

          if [ "$NOTARY_MODE" = skipped ]; then
            echo 'Notarization: skipped for this run (Developer ID signed only).'
          elif [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
            key_dir="$RUNNER_TEMP/strata-private-keys"
            mkdir -p "$key_dir"
            chmod 700 "$key_dir"
            key_path="$key_dir/AuthKey_${APPLE_API_KEY}.p8"
            ( umask 077; printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path" )
            {
              echo "STRATA_NOTARY_ISSUER=$APPLE_API_ISSUER"
              echo "STRATA_NOTARY_KEY_ID=$APPLE_API_KEY"
              echo "STRATA_NOTARY_KEY_PATH=$key_path"
              echo "STRATA_MACOS_NOTARIZE=1"
            } >> "$GITHUB_ENV"
            echo 'Notarization: App Store Connect API key'
          elif [ -n "$REQUIRE_APPLE_SIGNING" ]; then
            echo '::error title=macOS notarization::APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_PRIVATE_KEY are required for release-capable builds in this repository.'
            exit 1
          else
            echo '::warning title=macOS not notarized::Developer ID signed without notarization credentials; Gatekeeper will still warn.'
          fi

      - name: Build test installers
        if: env.PACKAGE_INSTALLERS == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Benchmark Arena upload key, compiled in at build time. Builds without it (forks, PRs from forks) are
          # read-only; release-capable runs in this repository fail the build if the secret is missing.
          STRATA_ARENA_APP_KEY: ${{ secrets.ARENA_APP_KEY }}
          STRATA_ARENA_REQUIRE_KEY: ${{ github.repository == 'hongfaqiu/strata-manager' && github.event_name != 'pull_request' && '1' || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          # macOS uploads its own artifacts after notarization (see below).
          uploadWorkflowArtifacts: ${{ runner.os != 'macOS' }}
          workflowArtifactNamePattern: 'ci-[platform]-[arch]-[bundle]'
          uploadUpdaterJson: false

      - name: Verify the macOS code signature
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        run: |
          set -euo pipefail
          bundle="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Strata Manager.app"
          dmg="$bundle/dmg/Strata Manager_${{ steps.package-version.outputs.version }}_aarch64.dmg"
          test -d "$app"
          test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app" "$app/Contents/MacOS/strata-supervisor"; do
            info=$(codesign -dv --verbose=4 "$bin" 2>&1)
            printf '%s\n' "$info" | grep -E '^(Identifier|Format|CodeDirectory|CDHash|Authority|TeamIdentifier|Timestamp|Runtime Version)=?' || true
            if [ -n "${STRATA_MACOS_SIGNED:-}" ]; then
              printf '%s\n' "$info" | grep -q '^Authority=Developer ID Application:' || { echo "::error::$bin is not Developer ID signed"; exit 1; }
              printf '%s\n' "$info" | grep -Eq '^CodeDirectory .*flags=.*runtime' || { echo "::error::$bin lacks the hardened runtime"; exit 1; }
            fi
          done
          if [ -n "${STRATA_MACOS_SIGNED:-}" ]; then
            if ! codesign -dv --verbose=2 "$dmg" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            fi
            codesign --verify --strict --verbose=2 "$dmg"
          else
            echo 'Ad-hoc signed (no Apple certificate).'
          fi

      # Only the .app is notarized (one zip submission, like tauri does); the DMG
      # is never submitted. Once the app is stapled, the DMG is rebuilt around the
      # stapled app and Developer ID signed. Submitting retries network errors and
      # fails if Apple still can't be reached, because without a submission id
      # nothing can be followed up later.
      - name: Submit the macOS app for notarization
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true' && steps.notary-policy.outputs.mode != 'skipped'
        run: |
          set -uo pipefail
          version="${{ steps.package-version.outputs.version }}"
          bundle="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Strata Manager.app"
          dmg="$bundle/dmg/Strata Manager_${version}_aarch64.dmg"
          record_dir="$RUNNER_TEMP/macos-notarization"
          mkdir -p "$record_dir" || exit 1
          if [ -z "${STRATA_MACOS_NOTARIZE:-}" ]; then
            echo 'No notarization credentials: nothing submitted.'
            exit 0
          fi
          zip="$RUNNER_TEMP/macos-notarization-upload/Strata Manager.zip"
          mkdir -p "$(dirname "$zip")" && ditto -c -k --keepParent "$app" "$zip" || exit 1
          result=$(bash scripts/macos-notary.sh retry 'notarytool submit' xcrun notarytool submit "$zip" \
            --key "$STRATA_NOTARY_KEY_PATH" --key-id "$STRATA_NOTARY_KEY_ID" --issuer "$STRATA_NOTARY_ISSUER" --output-format json 2>&1)
          rc=$?
          id=$(printf '%s\n' "$result" | python3 -c 'import json,sys
          for line in sys.stdin:
              try: print(json.loads(line).get("id", "")); break
              except Exception: pass')
          if [ "$rc" -ne 0 ] || ! [[ "$id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo '::error title=macOS notarization::Could not submit the app to Apple.'
            exit 1
          fi
          echo "Notary submission: $id"
          cdhash=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^CDHash=//p' | head -n1)
          team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -n1)
          ZIP="$zip" DMG="$dmg" SUBMISSION="$id" VERSION="$version" CDHASH="$cdhash" TEAM="$team" \
            python3 - "$record_dir/Strata Manager_${version}_aarch64.notarization.json" <<'PY' || exit 1
          import hashlib, json, os, sys
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''): h.update(chunk)
              return h.hexdigest()
          if not os.environ['CDHASH'] or not os.environ['TEAM']: sys.exit('App CDHash/TeamIdentifier unreadable')
          dmg = os.environ['DMG']
          record = {
            'protocol': 'strata-macos-notarization/v2', 'submissionId': os.environ['SUBMISSION'],
            'version': os.environ['VERSION'], 'sourceSha': os.environ['GITHUB_SHA'],
            'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'mode': os.environ['MACOS_NOTARIZATION'], 'stapled': False,
            'app': {'cdhash': os.environ['CDHASH'].lower(), 'teamIdentifier': os.environ['TEAM'], 'submittedZipSha256': sha(os.environ['ZIP'])},
            'dmg': {'name': os.path.basename(dmg), 'sha256': sha(dmg), 'size': os.path.getsize(dmg)},
          }
          with open(sys.argv[1], 'x') as f: json.dump(record, f, indent=2)
          PY
          rm -rf "$(dirname "$zip")"
          echo "STRATA_NOTARY_SUBMISSION=$id" >> "$GITHUB_ENV"

      # wait: up to 60 min, fail if Apple is still processing. auto (default): wait
      # up to MACOS_NOTARIZATION_TIMEOUT (repository variable, default 30m); if Apple
      # is still processing, keep the signed-but-unstapled bytes, skip the confirm
      # gate below and let the release defer macOS. Network errors are retried
      # 3 times 30 s apart and end as a ::warning:: (unstapled, so macOS is deferred
      # or the release refused, never shipped unstapled). Invalid/Rejected and any
      # signing problem always fail.
      - name: Wait for notarization and staple the macOS app
        id: notarize-wait
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true' && env.MACOS_NOTARIZATION != 'defer' && steps.notary-policy.outputs.mode != 'skipped'
        env:
          MACOS_NOTARIZATION_TIMEOUT: ${{ vars.MACOS_NOTARIZATION_TIMEOUT || '30m' }}
        run: |
          set -uo pipefail
          version="${{ steps.package-version.outputs.version }}"
          bundle="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Strata Manager.app"
          dmg="$bundle/dmg/Strata Manager_${version}_aarch64.dmg"
          record="$RUNNER_TEMP/macos-notarization/Strata Manager_${version}_aarch64.notarization.json"
          notary=scripts/macos-notary.sh
          unstapled() { echo "::warning title=macOS not stapled::$1 This run's macOS bytes stay unstapled: the release publishes Windows/Linux first and macos-notarize-followup.yml adds macOS once Apple accepts."; echo 'stapled=false' >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "${STRATA_NOTARY_SUBMISSION:-}" ]; then
            echo 'Not submitted (no credentials): nothing to staple.'
            exit 0
          fi
          timeout=60m
          [ "$MACOS_NOTARIZATION" = auto ] && timeout="$MACOS_NOTARIZATION_TIMEOUT"
          [[ "$timeout" =~ ^([0-9]+)([smh])$ ]] || { echo '::error::MACOS_NOTARIZATION_TIMEOUT must look like 30m.'; exit 1; }
          case "${BASH_REMATCH[2]}" in s) secs=${BASH_REMATCH[1]};; m) secs=$((BASH_REMATCH[1] * 60));; h) secs=$((BASH_REMATCH[1] * 3600));; esac
          status=$(bash "$notary" wait "$STRATA_NOTARY_SUBMISSION" "$secs"); rc=$?
          [ "$rc" -eq 75 ] && unstapled 'Could not reach Apple to read the notarization status.'
          [ "$rc" -eq 0 ] || exit 1
          echo "Notary submission $STRATA_NOTARY_SUBMISSION: $status"
          case "$status" in
            Accepted) ;;
            'In Progress')
              if [ "$MACOS_NOTARIZATION" = auto ]; then unstapled "Apple is still notarizing after $timeout."; fi
              echo '::error title=macOS notarization::Apple did not finish within 60 minutes (wait mode).'; exit 1;;
            *)
              bash "$notary" log "$STRATA_NOTARY_SUBMISSION" || true
              echo "::error title=macOS notarization::Apple did not accept the app ($status)."; exit 1;;
          esac
          bash "$notary" staple-app "$app"; rc=$?
          [ "$rc" -eq 75 ] && unstapled 'Could not reach Apple to staple the app.'
          [ "$rc" -eq 0 ] || exit 1
          team=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["app"]["teamIdentifier"])' "$record") || exit 1
          bash "$notary" restage-dmg "$dmg" "$app" "$APPLE_SIGNING_IDENTITY" "$team"; rc=$?
          [ "$rc" -eq 75 ] && unstapled 'Could not reach the Apple timestamp service to sign the rebuilt DMG.'
          [ "$rc" -eq 0 ] || exit 1
          python3 - "$record" "$dmg" <<'PY' || exit 1
          import hashlib, json, os, sys
          path, dmg = sys.argv[1], sys.argv[2]
          record = json.load(open(path))
          h = hashlib.sha256()
          with open(dmg, 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''): h.update(chunk)
          record['stapled'] = True
          record['dmg'].update({'sha256': h.hexdigest(), 'size': os.path.getsize(dmg)})
          json.dump(record, open(path, 'w'), indent=2)
          PY
          echo 'stapled=true' >> "$GITHUB_OUTPUT"

      # Normal (non-deferred) releases require this gate; it only runs when the app
      # carries Apple's ticket and the DMG was rebuilt around it. Offline checks
      # must pass; the online stapler check only warns on network errors.
      - name: Confirm the macOS app is stapled and the DMG is signed
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true' && steps.notarize-wait.outputs.stapled == 'true'
        run: |
          set -uo pipefail
          version="${{ steps.package-version.outputs.version }}"
          bundle="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Strata Manager.app"
          record="$RUNNER_TEMP/macos-notarization/Strata Manager_${version}_aarch64.notarization.json"
          read -r cdhash team < <(python3 -c 'import json,sys; r = json.load(open(sys.argv[1])); print(r["app"]["cdhash"], r["app"]["teamIdentifier"])' "$record") || exit 1
          test -s "$app/Contents/CodeResources" || { echo '::error::The app is not stapled.'; exit 1; }
          bash scripts/macos-notary.sh verify-dmg "$bundle/dmg/Strata Manager_${version}_aarch64.dmg" "$cdhash" "$team" || exit 1
          bash scripts/macos-notary.sh retry 'stapler validate' xcrun stapler validate "$app"; rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 75 ] || exit 1

      - name: Package the macOS app archive for the updater
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        run: |
          set -euo pipefail
          app_dir="${CARGO_TARGET_DIR}/${{ matrix.target }}/release/bundle/macos"
          version="${{ steps.package-version.outputs.version }}"
          archive="${RUNNER_TEMP}/macos-updater/Strata Manager_${version}_aarch64.app.tar.gz"
          test -d "${app_dir}/Strata Manager.app"
          mkdir -p "$(dirname "$archive")"
          tar -czf "$archive" -C "$app_dir" "Strata Manager.app"
          test -f "$archive"
          test ! -d "$archive"
      - name: Upload the macOS updater archive
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-darwin-aarch64-app-tarball
          path: ${{ runner.temp }}/macos-updater/Strata Manager_${{ steps.package-version.outputs.version }}_aarch64.app.tar.gz
          if-no-files-found: error
          compression-level: 0

      # Uploaded here instead of by tauri-action so the artifact holds the DMG
      # rebuilt around the stapled app (when stapled) that releases promote.
      - name: Upload the macOS DMG
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-darwin-aarch64-dmg
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/dmg/Strata Manager_${{ steps.package-version.outputs.version }}_aarch64.dmg
          if-no-files-found: error
          compression-level: 0

      # Submission id, the app CDHash and the exact DMG bytes, for macos-notarize-followup.yml.
      - name: Upload the macOS notarization record
        if: runner.os == 'macOS' && env.PACKAGE_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-darwin-aarch64-notarization
          path: ${{ runner.temp }}/macos-notarization/Strata Manager_${{ steps.package-version.outputs.version }}_aarch64.notarization.json
          if-no-files-found: ${{ env.STRATA_MACOS_NOTARIZE == '1' && 'error' || 'ignore' }}

      - name: Remove the macOS signing keychain and API key
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${STRATA_SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$STRATA_SIGNING_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/strata-private-keys" "$RUNNER_TEMP/strata-signing.p12"

      - name: Verify installed Windows package and background IPC
        if: runner.os == 'Windows' && env.PACKAGE_INSTALLERS == 'true'
        run: node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"
      - name: Verify beta.2 to first stable upgrade and retained application data
        if: runner.os == 'Windows' && steps.package-version.outputs.version == '0.1.2' && env.PACKAGE_INSTALLERS == 'true'
        env:
          UPGRADE_FROM_INSTALLER: ${{ steps.upgrade-fixture.outputs.installer }}
          UPGRADE_FROM_VERSION: ${{ steps.upgrade-fixture.outputs.version }}
        run: node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}" --upgrade-from-installer "$env:UPGRADE_FROM_INSTALLER" --upgrade-from-version "$env:UPGRADE_FROM_VERSION"
      - name: Verify Linux AppImage and DEB startup under Xvfb
        if: runner.os == 'Linux' && env.PACKAGE_INSTALLERS == 'true'
        run: dbus-run-session -- xvfb-run -a bash scripts/release-linux-tests.sh node scripts/preview-package-smoke.mjs --bundle-dir "${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle" --version "${{ steps.package-version.outputs.version }}"

  native-coverage:
    name: Native coverage verification
    # Starts only after every shard and all desktop jobs succeeded, so no job
    # polls the Actions API while holding a Windows runner.
    needs: [changes, native-windows, native-linux, desktop]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download this attempt's Windows native coverage proofs
        uses: actions/download-artifact@v4
        with:
          pattern: ci-windows-native-shard-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-native-coverage
      - name: Download this attempt's Linux native coverage proofs
        uses: actions/download-artifact@v4
        with:
          pattern: ci-linux-native-shard-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-native-coverage
      - name: Native tests (Windows)
        run: node scripts/ci-linux-native-tests.mjs --target x86_64-pc-windows-msvc --groups 3 --aggregate "$RUNNER_TEMP/windows-native-coverage" --output "$RUNNER_TEMP/windows-native-coverage.json"
      - name: Native tests (Linux)
        run: node scripts/ci-linux-native-tests.mjs --aggregate "$RUNNER_TEMP/linux-native-coverage" --output "$RUNNER_TEMP/linux-native-coverage.json"
